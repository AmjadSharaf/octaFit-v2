name: octafit
description: OctaFit - AI-Powered Fitness Ecosystem (Frontend Only)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
